name: Refresh profile data

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # The default GITHUB_TOKEN cannot see private repos or private contributions.
      PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.PROFILE_TOKEN == ''
        run: echo "::notice::PROFILE_TOKEN is not set, keeping the committed data."
      - uses: actions/checkout@v4
        if: env.PROFILE_TOKEN != ''
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
      - name: Regenerate data
        if: env.PROFILE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 scripts/build_data.py
      - name: Commit changes
        if: env.PROFILE_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile.json
          git diff --cached --quiet || { git commit -m "Refresh profile data"; git push; }
